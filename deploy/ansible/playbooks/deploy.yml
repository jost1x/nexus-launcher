---
- name: Deploy and start the NEXUS prototype service
  hosts: r36s_targets
  gather_facts: true
  become: false

  vars:
    nexus_local_bin_dir: "{{ playbook_dir }}/../../../apps/nexusd/bin"
    nexus_remote_bin_dir: "{{ ansible_facts.user_dir }}/.local/opt/nexusd"
    nexus_user_bin_dir: "{{ ansible_facts.user_dir }}/.local/bin"
    nexus_remote_state_dir: "{{ ansible_facts.user_dir }}/.cache/nexusd"
    nexus_socket: "{{ nexus_remote_state_dir }}/nexusd.sock"
    nexus_pidfile: "{{ nexus_remote_state_dir }}/nexusd.pid"
    nexus_service_name: nexusd
    nexus_service_unit: /etc/systemd/system/nexusd.service
    nexus_backlight_rule: /etc/udev/rules.d/90-nexus-backlight.rules
    nexus_power_sudoers: /etc/sudoers.d/nexusd-power
    nexus_backlight_group: nexusd-backlight

  tasks:
    - name: Require the expected ARM64 target architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture in ["aarch64", "armv8l"]
        fail_msg: "Target architecture is {{ ansible_facts.architecture }}; build and deploy to a 64-bit ARM target."

    - name: Check that the ARM64 daemon binary exists on the controller
      ansible.builtin.stat:
        path: "{{ nexus_local_bin_dir }}/nexusd"
      delegate_to: localhost
      become: false
      register: nexus_daemon_binary

    - name: Check that the ARM64 CLI binary exists on the controller
      ansible.builtin.stat:
        path: "{{ nexus_local_bin_dir }}/nexusctl"
      delegate_to: localhost
      become: false
      register: nexus_cli_binary

    - name: Require both ARM64 binaries before deploying
      ansible.builtin.assert:
        that:
          - nexus_daemon_binary.stat.exists
          - nexus_cli_binary.stat.exists
        fail_msg: Run `make build-arm64` from apps/nexusd before deploying.

    - name: Ensure hardware access groups exist
      become: true
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop:
        - input
        - audio
        - "{{ nexus_backlight_group }}"

    - name: Create private directories for the prototype
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ nexus_remote_bin_dir }}"
        - "{{ nexus_user_bin_dir }}"
        - "{{ nexus_remote_state_dir }}"

    - name: Copy nexusd to the console
      ansible.builtin.copy:
        src: "{{ nexus_local_bin_dir }}/nexusd"
        dest: "{{ nexus_remote_bin_dir }}/nexusd"
        mode: "0755"
      register: nexus_daemon_copy

    - name: Copy nexusctl to the console
      ansible.builtin.copy:
        src: "{{ nexus_local_bin_dir }}/nexusctl"
        dest: "{{ nexus_remote_bin_dir }}/nexusctl"
        mode: "0755"

    - name: Link executables into the user's command directory
      ansible.builtin.file:
        src: "{{ nexus_remote_bin_dir }}/{{ item }}"
        dest: "{{ nexus_user_bin_dir }}/{{ item }}"
        state: link
      loop:
        - nexusd
        - nexusctl

    - name: Add the user's command directory to the login PATH
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.user_dir }}/.profile"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        mode: "0644"

    - name: Stop the legacy temporary prototype after a daemon update
      ansible.builtin.shell: |
        set -eu
        pidfile={{ nexus_pidfile | quote }}
        binary={{ nexus_remote_bin_dir | quote }}/nexusd
        if [ -f "$pidfile" ]; then
          pid=$(cat "$pidfile")
          if [ -r "/proc/$pid/cmdline" ]; then
            command_line=$(tr '\0' ' ' < "/proc/$pid/cmdline")
            case "$command_line" in
              *"$binary"*)
                kill -TERM "$pid"
                i=0
                while kill -0 "$pid" 2>/dev/null && [ "$i" -lt 5 ]; do
                  sleep 1
                  i=$((i + 1))
                done
                if kill -0 "$pid" 2>/dev/null; then
                  echo "nexusd did not stop after SIGTERM" >&2
                  exit 1
                fi
                ;;
            esac
          fi
          rm -f "$pidfile"
        fi
      args:
        executable: /bin/sh

    - name: Allow the dedicated backlight group to change only the backlight level
      become: true
      ansible.builtin.copy:
        dest: "{{ nexus_backlight_rule }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          SUBSYSTEM=="backlight", ACTION=="add", RUN+="/usr/bin/chgrp {{ nexus_backlight_group }} /sys%p/brightness", RUN+="/usr/bin/chmod 0660 /sys%p/brightness"
      register: nexus_backlight_rule_copy

    - name: Apply the backlight access rule to detected backlights
      become: true
      ansible.builtin.command:
        argv:
          - udevadm
          - trigger
          - --action=add
          - --subsystem-match=backlight
      when: nexus_backlight_rule_copy.changed
      changed_when: true

    - name: Allow only confirmed reboot and poweroff commands without a password
      become: true
      ansible.builtin.copy:
        dest: "{{ nexus_power_sudoers }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: "{{ ansible_facts.user_id }} ALL=(root) NOPASSWD: /usr/bin/systemctl reboot, /usr/bin/systemctl poweroff\n"

    - name: Install the nexusd systemd unit with Wi-Fi scan capability
      become: true
      ansible.builtin.copy:
        dest: "{{ nexus_service_unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=NEXUS system and hardware daemon
          After=local-fs.target

          [Service]
          Type=simple
          User={{ ansible_facts.user_id }}
          Group={{ ansible_facts.user_gid }}
          SupplementaryGroups=input audio {{ nexus_backlight_group }}
          Environment=HOME={{ ansible_facts.user_dir }}
          Environment=XDG_CACHE_HOME={{ ansible_facts.user_dir }}/.cache
          ExecStart={{ nexus_remote_bin_dir }}/nexusd --socket {{ nexus_socket }}
          Restart=on-failure
          RestartSec=2s
          AmbientCapabilities=CAP_NET_ADMIN
          CapabilityBoundingSet=CAP_NET_ADMIN
          # Required so sudo can raise its effective UID; sudoers limits this to reboot/poweroff.
          NoNewPrivileges=no
          ProtectSystem=strict
          ReadWritePaths={{ nexus_remote_state_dir }} /sys/class/backlight/backlight/brightness
          PrivateTmp=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          RestrictSUIDSGID=yes
          LockPersonality=yes

          [Install]
          WantedBy=multi-user.target
      register: nexus_service_unit_copy

    - name: Enable and restart nexusd
      become: true
      ansible.builtin.systemd_service:
        name: "{{ nexus_service_name }}"
        daemon_reload: "{{ nexus_service_unit_copy.changed }}"
        enabled: true
        state: restarted

    - name: Verify reboot is authorized without executing it
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -l
          - --
          - /usr/bin/systemctl
          - reboot
      changed_when: false

    - name: Verify poweroff is authorized without executing it
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -l
          - --
          - /usr/bin/systemctl
          - poweroff
      changed_when: false

    - name: Verify unrelated privileged commands cannot run without a password
      ansible.builtin.command:
        argv:
          - sudo
          - -k
          - -n
          - /usr/bin/id
      register: nexus_unrestricted_sudo_check
      changed_when: false
      failed_when: nexus_unrestricted_sudo_check.rc == 0

    - name: Wait for the daemon health RPC to respond
      ansible.builtin.command:
        argv:
          - "{{ nexus_remote_bin_dir }}/nexusctl"
          - --socket
          - "{{ nexus_socket }}"
          - --timeout
          - 2s
          - health
      register: nexus_health
      changed_when: false
      retries: 10
      delay: 1
      until: nexus_health.rc == 0

    - name: Report daemon health
      ansible.builtin.debug:
        msg: "nexusd health: {{ nexus_health.stdout }}"
