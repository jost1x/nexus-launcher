---
- name: Stop the temporary NEXUS prototype
  hosts: r36s_targets
  gather_facts: true
  become: true

  vars:
    nexus_service_name: nexusd

  tasks:
    - name: Stop and disable the nexusd prototype service
      ansible.builtin.systemd_service:
        name: "{{ nexus_service_name }}"
        enabled: false
        state: stopped
