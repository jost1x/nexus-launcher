---
- name: Deploy and show the NEXUS UI on the R36S framebuffer
  hosts: r36s_targets
  gather_facts: true
  become: false

  vars:
    nexus_ui_bundle_dir: "{{ playbook_dir }}/../../../build/docker/arm64/nexus-r36s-bundle"
    nexus_ui_remote_dir: /opt/nexus-ui
    nexus_ui_socket: "{{ ansible_facts.user_dir }}/.cache/nexusd/nexusd.sock"
    nexus_ui_runtime_unit: nexus-ui-r36s
    nexus_ui_service_unit: /etc/systemd/system/nexus-ui-r36s.service

  tasks:
    - name: Require the expected ARM64 target architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture in ["aarch64", "armv8l"]
        fail_msg: "Target architecture is {{ ansible_facts.architecture }}; build the R36S framebuffer binary."

    - name: Check that the framebuffer UI binary exists on the controller
      ansible.builtin.stat:
        path: "{{ nexus_ui_bundle_dir }}/nexus-ui"
      delegate_to: localhost
      become: false
      register: nexus_ui_binary

    - name: Check that the runtime library bundle exists on the controller
      ansible.builtin.stat:
        path: "{{ nexus_ui_bundle_dir }}/lib"
      delegate_to: localhost
      become: false
      register: nexus_ui_libraries

    - name: Require the complete UI bundle before deploying
      ansible.builtin.assert:
        that:
          - nexus_ui_binary.stat.exists
          - nexus_ui_binary.stat.isreg
          - nexus_ui_libraries.stat.exists
          - nexus_ui_libraries.stat.isdir
        fail_msg: "Build/package the ARM64 framebuffer app and place nexus-ui plus lib/ in {{ nexus_ui_bundle_dir }}."

    - name: Install UI runtime dependencies from Debian packages
      become: true
      ansible.builtin.apt:
        name:
          - libc-bin
          - libsdl2-2.0-0
          - libgrpc++1.51
          - libprotobuf32
        state: present
      when:
        - ansible_facts.os_family == "Debian"
      tags:
        - ui_dependencies

    - name: Read libraries available after package installation
      ansible.builtin.shell: "/sbin/ldconfig -p | awk '{print $1}' | sort -u"
      args:
        executable: /bin/sh
      register: nexus_ui_target_libraries
      changed_when: false
      tags:
        - ui_dependencies

    - name: List top-level runtime libraries in the bundle
      ansible.builtin.find:
        paths: "{{ nexus_ui_bundle_dir }}/lib"
        file_type: file
        recurse: false
      delegate_to: localhost
      become: false
      register: nexus_ui_bundle_libraries
      tags:
        - ui_dependencies

    - name: Create the root-owned runtime directory
      become: true
      ansible.builtin.file:
        path: "{{ nexus_ui_remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Upload the framebuffer UI executable
      become: true
      ansible.builtin.copy:
        src: "{{ nexus_ui_bundle_dir }}/nexus-ui"
        dest: "{{ nexus_ui_remote_dir }}/nexus-ui"
        owner: root
        group: root
        mode: "0755"
      register: nexus_ui_binary_upload

    - name: Upload the UI runtime libraries
      become: true
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ nexus_ui_remote_dir }}/lib/{{ item.path | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ nexus_ui_bundle_libraries.files }}"
      when: item.path | basename not in nexus_ui_target_libraries.stdout_lines
      loop_control:
        label: "{{ item.path | basename }}"
      register: nexus_ui_libraries_upload
      tags:
        - ui_dependencies

    - name: Check whether the UI runtime unit is active
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ nexus_ui_runtime_unit }}.service"
      register: nexus_ui_runtime_status
      failed_when: false
      changed_when: false

    - name: Check whether the UI runtime unit is enabled at boot
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ nexus_ui_runtime_unit }}.service"
      register: nexus_ui_enabled_status
      failed_when: false
      changed_when: false

    - name: Install the persistent UI service definition
      become: true
      ansible.builtin.copy:
        dest: "{{ nexus_ui_service_unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=NEXUS launcher UI on the R36S framebuffer
          Requires=nexusd.service
          After=local-fs.target systemd-logind.service nexusd.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/openvt -f -w -c 2 -s -- /usr/bin/env SDL_VIDEODRIVER=dummy LD_LIBRARY_PATH={{ nexus_ui_remote_dir }}/lib NEXUSD_SOCKET={{ nexus_ui_socket }} /usr/bin/systemd-cat --identifier=nexus-ui -- {{ nexus_ui_remote_dir }}/nexus-ui
          Restart=always
          RestartSec=2s
          KillMode=control-group
          TimeoutStopSec=3s

          [Install]
          WantedBy=multi-user.target
      register: nexus_ui_service_unit_copy

    - name: Decide whether the UI needs a restart
      ansible.builtin.set_fact:
        nexus_ui_restart_required: >-
          {{ (nexus_ui_force_restart | default(false) | bool)
             or (nexus_ui_binary_upload.changed | default(false))
             or (nexus_ui_libraries_upload.changed | default(false))
             or (nexus_ui_runtime_status.stdout != "active")
             or (nexus_ui_enabled_status.stdout != "enabled")
             or (nexus_ui_service_unit_copy.changed | default(false)) }}

    - name: Stop the currently running UI before switching virtual terminals
      become: true
      ansible.builtin.shell: |
        set -eu
        systemctl stop --no-block {{ (nexus_ui_runtime_unit ~ '.service') | quote }} >/dev/null 2>&1 || true
        if pgrep -x nexus-ui >/dev/null; then
          pkill -TERM -x nexus-ui || true
          i=0
          while pgrep -x nexus-ui >/dev/null && [ "$i" -lt 10 ]; do
            sleep 1
            i=$((i + 1))
          done
          if pgrep -x nexus-ui >/dev/null; then
            echo "nexus-ui did not stop after SIGTERM" >&2
            exit 1
          fi
          echo stopped
        fi
      args:
        executable: /bin/sh
      register: nexus_ui_stop
      changed_when: "'stopped' in nexus_ui_stop.stdout"
      when: nexus_ui_restart_required

    - name: Return to the text console before launching the UI
      become: true
      ansible.builtin.command:
        argv:
          - timeout
          - 2s
          - chvt
          - "1"
      changed_when: false
      failed_when: false
      when: nexus_ui_restart_required

    - name: Enable and start the UI service at boot
      become: true
      ansible.builtin.systemd_service:
        name: "{{ nexus_ui_runtime_unit }}.service"
        daemon_reload: "{{ nexus_ui_service_unit_copy.changed }}"
        enabled: true
        state: "{{ 'restarted' if nexus_ui_restart_required else 'started' }}"

    - name: Confirm that the persistent UI unit is running
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ nexus_ui_runtime_unit }}.service"
      changed_when: false
      when: nexus_ui_restart_required
