minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: gofmt-nexusd
        name: gofmt (nexusd)
        entry: gofmt -w
        language: system
        types: [go]
        files: ^apps/nexusd/

      - id: golangci-lint-nexusd
        name: golangci-lint (nexusd)
        entry: bash -c 'cd apps/nexusd && golangci-lint run ./...'
        language: system
        types: [go]
        files: ^apps/nexusd/
        pass_filenames: false
